plugins { id 'com.android.application' }
android {
 namespace 'com.lifememory.app'
 compileSdk 35
 buildToolsVersion '35.0.0'
 bundle { language { enableSplit = false } }
 defaultConfig { applicationId 'com.lifememory.app'; minSdk 26; targetSdk 35; versionCode 9; versionName '0.8.0-alpha02'; testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
 implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.20')
 implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
 implementation 'androidx.core:core:1.13.1'
 implementation 'androidx.exifinterface:exifinterface:1.3.7'
 implementation 'com.alphacephei:vosk-android:0.3.75@aar'
 implementation 'net.java.dev.jna:jna:5.18.1@aar'
 implementation 'androidx.work:work-runtime:2.9.1'
 androidTestImplementation 'androidx.test:runner:1.6.2'
 androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
